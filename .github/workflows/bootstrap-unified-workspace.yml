name: bootstrap unified MCP Boundary workspace

on:
  push:
    branches: [codex/unified-mcp-boundary-20260915]

permissions:
  contents: write

jobs:
  import-and-verify:
    if: contains(github.event.head_commit.message, '[bootstrap-unified]')
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build unified workspace from pinned sources
        run: python3 scripts/bootstrap_unified_workspace.py

      - name: Verify plugin and workspace
        run: |
          python3 scripts/build_plugin.py --check
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tests/static_check.py --no-report

      - name: Verify imported Guide
        working-directory: guide
        run: |
          python skill/mcp-server-engineering/scripts/check_python_syntax.py skill/mcp-server-engineering/scripts tools tests
          python -m unittest discover -v
          python skill/mcp-server-engineering/scripts/validate_version_register.py VERSION-REGISTER.json
          python skill/mcp-server-engineering/scripts/sync_profile_mirrors.py --check VERSION-REGISTER.json
          python skill/mcp-server-engineering/scripts/check_bilingual_coverage.py .
          python tools/validate_evaluation_corpus.py .
          python skill/mcp-server-engineering/scripts/validate_skill_package.py skill/mcp-server-engineering
          python skill/mcp-server-engineering/scripts/check_markdown_links.py .
          python skill/mcp-server-engineering/scripts/scan_review_bundle.py .

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Verify imported Field Lab
        working-directory: lab
        run: |
          npm ci
          npm run check

      - name: Commit unified workspace
        run: |
          rm -f scripts/bootstrap_unified_workspace.py
          git restore --source=HEAD -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m "vendor guide and field lab into unified workspace"
          git push origin "HEAD:${GITHUB_REF_NAME}"
